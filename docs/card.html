<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #fff; }
  .card {
    width: 1200px; height: 630px; position: relative; overflow: hidden;
    font-family: "Inter", sans-serif; color: #0a0a0a; background: #fff;
    padding: 60px 72px 56px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .kicker {
    font-weight: 900; font-size: 22px; letter-spacing: 0.14em;
    text-transform: uppercase; color: #0247fe;
  }
  h1 {
    font-weight: 900; font-size: 96px; line-height: 0.97; letter-spacing: -0.045em;
  }
  h1 span { color: #0247fe; }
  .cmd {
    background: #0a0a0a; border-radius: 18px; padding: 28px 34px;
    font-family: "JetBrains Mono", monospace; font-size: 26px;
    color: #fff; white-space: nowrap; align-self: flex-start;
  }
  .cmd .p { color: #7a7a7a; }
  .foot {
    display: flex; justify-content: space-between; align-items: baseline;
    font-weight: 600; font-size: 22px; color: #6b6b6b;
  }
  .foot b { font-weight: 900; color: #0a0a0a; }
</style>
</head>
<body>
<div class="card">
  <div class="kicker">Ókeypis · opinn hugbúnaður · macOS</div>
  <h1>Íslensk orðskipting fyrir InDesign<span>.</span></h1>
  <div class="foot">
    <span><b>github.com/arnorb/hunspell-is-indesign</b></span>
    <span>InDesign 2024 · 2025 · 2026</span>
  </div>
</div>
</body>
</html>
